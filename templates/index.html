<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CertBrain — Om Mehta's Certification Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep:       #0a0c10;
      --bg-base:       #0f1117;
      --bg-card:       #161b26;
      --bg-hover:      #1e2535;
      --bg-sidebar:    #0c0e14;
      --border:        #1e2535;
      --border-bright: #2a3248;
      --accent:        #6c8ef5;
      --accent-glow:   #6c8ef540;
      --accent-dim:    #3d5adb;
      --green:         #3dd68c;
      --red:           #f25f5c;
      --yellow:        #f5a623;
      --text-primary:  #e8eaf0;
      --text-secondary:#8892a4;
      --text-muted:    #4a5568;
      --sidebar-w:     280px;
      --topbar-h:      64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── Top Bar ───────────────────────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: rgba(12, 14, 20, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
    }
    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e8eaf0, #6c8ef5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .stat-chip .value {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }
    .stat-chip .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    .stat-chip .dot.red { background: var(--red); }
    .stat-chip .dot.green { background: var(--green); }

    #scan-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    #scan-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    #scan-btn:active { transform: translateY(0); }
    #scan-btn.scanning {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      pointer-events: none;
    }
    #scan-btn .btn-icon { font-size: 15px; }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #layout {
      display: flex;
      position: fixed;
      top: var(--topbar-h);
      bottom: 0;
      left: 0;
      right: 0;
    }

    /* ── Sidebar ────────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    #sidebar-search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    #sidebar-search:focus { border-color: var(--accent); }
    #sidebar-search::placeholder { color: var(--text-muted); }

    #cert-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    #cert-list::-webkit-scrollbar { width: 4px; }
    #cert-list::-webkit-scrollbar-track { background: transparent; }
    #cert-list::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }

    .cert-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .cert-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .cert-item.active {
      background: var(--accent-glow);
      border-color: var(--accent);
    }
    .cert-item .item-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .cert-item.needs-review .item-icon { background: rgba(242, 95, 92, 0.15); }
    .cert-item .item-text { flex: 1; min-width: 0; }
    .cert-item .item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cert-item.needs-review .item-name { color: var(--red); }
    .cert-item .item-issuer {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .review-badge {
      font-size: 10px;
      background: rgba(242, 95, 92, 0.15);
      color: var(--red);
      border: 1px solid rgba(242, 95, 92, 0.3);
      border-radius: 4px;
      padding: 1px 5px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Main Panel ──────────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      background: var(--bg-base);
    }
    #main::-webkit-scrollbar { width: 6px; }
    #main::-webkit-scrollbar-track { background: transparent; }
    #main::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 6px; }

    /* Empty / Placeholder State */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 56px; opacity: 0.4; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text-secondary); }
    .empty-sub { font-size: 13px; text-align: center; max-width: 280px; }

    /* Cert Card */
    #cert-card { display: none; max-width: 760px; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }
    .card-badge {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      box-shadow: 0 8px 32px var(--accent-glow);
    }
    .card-meta { flex: 1; }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .card-subtitle {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-tag {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .one-liner-block {
      background: linear-gradient(135deg, rgba(108,142,245,0.08), rgba(61,86,219,0.04));
      border: 1px solid rgba(108,142,245,0.2);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      font-style: italic;
    }

    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .learnings-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .learning-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .learning-num {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .learning-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      padding-top: 2px;
      line-height: 1.5;
    }

    .use-case-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .interview-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .interview-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.75;
      font-style: italic;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scan overlay toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    .toast-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Spinner */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(108,142,245,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty sidebar state */
    .sidebar-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* Scrollbar for all */
    * { scrollbar-width: thin; scrollbar-color: var(--border-bright) transparent; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.3s ease both; }
  </style>
</head>
<body>

<!-- ── Top Bar ──────────────────────────────────────────────────────────── -->
<header id="topbar">
  <div class="brand">
    <div class="brand-icon">🧠</div>
    <span class="brand-name">CertBrain</span>
  </div>

  <div class="stat-chip">
    <div class="dot green"></div>
    <span>Total</span>
    <span class="value" id="stat-total">—</span>
  </div>
  <div class="stat-chip">
    <div class="dot"></div>
    <span>Updated</span>
    <span class="value" id="stat-updated">—</span>
  </div>
  <div class="stat-chip">
    <div class="dot red"></div>
    <span>Review</span>
    <span class="value" id="stat-review">—</span>
  </div>

  <button id="scan-btn" onclick="triggerScan()">
    <span class="btn-icon">🔍</span>
    Scan for New Certs
  </button>
</header>

<!-- ── Main Layout ─────────────────────────────────────────────────────── -->
<div id="layout">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Certifications</div>
      <input id="sidebar-search" type="text" placeholder="Search certs…" oninput="filterCerts(this.value)" />
    </div>
    <div id="cert-list">
      <div class="sidebar-empty">Loading certificates…</div>
    </div>
  </aside>

  <!-- Main Panel -->
  <main id="main">
    <div id="empty-state">
      <div class="empty-icon">📂</div>
      <div class="empty-title">Select a certificate</div>
      <div class="empty-sub">Pick a cert from the sidebar to see full details, learnings, and interview answers.</div>
    </div>

    <div id="cert-card">
      <!-- Populated by JS -->
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg">Scanning for new certs…</span>
</div>

<script>
  let allCerts = [];
  let reviewFiles = [];
  let selectedIndex = null;

  /* ── Boot ───────────────────────────────────────────────────────────── */
  async function init() {
    await loadStats();
    await loadCerts();
  }

  /* ── Stats ──────────────────────────────────────────────────────────── */
  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      const s = await r.json();
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-updated').textContent = s.last_updated || 'Never';
      document.getElementById('stat-review').textContent = s.pending_review;
      reviewFiles = s.pending_review_files || [];
    } catch(e) { console.error('Stats error', e); }
  }

  /* ── Cert List ──────────────────────────────────────────────────────── */
  async function loadCerts() {
    try {
      const r = await fetch('/api/certs');
      allCerts = await r.json();
      renderSidebar(allCerts);
    } catch(e) {
      document.getElementById('cert-list').innerHTML =
        '<div class="sidebar-empty">Failed to load certs.</div>';
    }
  }

  function renderSidebar(certs) {
    const list = document.getElementById('cert-list');

    if (!certs.length) {
      list.innerHTML = '<div class="sidebar-empty">No certificates found.<br>Drop PDFs in ~/Documents/certs-pdf and hit Scan.</div>';
      return;
    }

    const icons = ['🏆','📜','🔐','🛡️','⚡','🌐','🔑','📊','🧩','✨'];

    list.innerHTML = certs.map((c, i) => {
      const name = c.cert_name || c.source_file || 'Unknown Cert';
      const issuer = c.issuer || 'Unknown Issuer';
      const needsReview = c.source_file && reviewFiles.includes(c.source_file);
      const icon = icons[i % icons.length];
      const activeClass = i === selectedIndex ? ' active' : '';
      const reviewClass = needsReview ? ' needs-review' : '';

      return `
        <div class="cert-item${activeClass}${reviewClass}" id="item-${i}" onclick="selectCert(${i})">
          <div class="item-icon">${needsReview ? '🚩' : icon}</div>
          <div class="item-text">
            <div class="item-name">${escapeHtml(name)}</div>
            <div class="item-issuer">${escapeHtml(issuer)} ${c.year ? '· ' + c.year : ''}</div>
          </div>
          ${needsReview ? '<div class="review-badge">Review</div>' : ''}
        </div>
      `;
    }).join('');
  }

  function filterCerts(query) {
    const q = query.toLowerCase();
    const filtered = q
      ? allCerts.filter(c =>
          (c.cert_name || '').toLowerCase().includes(q) ||
          (c.issuer || '').toLowerCase().includes(q) ||
          (c.one_liner || '').toLowerCase().includes(q)
        )
      : allCerts;
    renderSidebar(filtered);
  }

  /* ── Cert Card ──────────────────────────────────────────────────────── */
  function selectCert(idx) {
    selectedIndex = idx;

    // Update sidebar active state
    document.querySelectorAll('.cert-item').forEach(el => el.classList.remove('active'));
    const item = document.getElementById(`item-${idx}`);
    if (item) item.classList.add('active');

    const cert = allCerts[idx];
    if (!cert) return;

    document.getElementById('empty-state').style.display = 'none';
    const card = document.getElementById('cert-card');
    card.style.display = 'block';
    card.innerHTML = buildCertCard(cert);
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');
  }

  function buildCertCard(cert) {
    const name = cert.cert_name || 'Unknown Cert';
    const issuer = cert.issuer || 'Unknown';
    const year = cert.year || 'N/A';
    const oneLiner = cert.one_liner;
    const learnings = cert.learnings || [];
    const useCase = cert.use_case;
    const interview = cert.interview_answer;
    const src = cert.source_file || '';
    const processed = cert.processed_at || '';

    const oneLinerHtml = oneLiner
      ? `<div class="one-liner-block">"${escapeHtml(oneLiner)}"</div>`
      : '';

    const learningsHtml = learnings.filter(Boolean).length
      ? `
        <div class="section">
          <div class="section-label">Key Learnings</div>
          <div class="learnings-grid">
            ${learnings.filter(Boolean).map((l, i) => `
              <div class="learning-item">
                <div class="learning-num">${i+1}</div>
                <div class="learning-text">${escapeHtml(l)}</div>
              </div>
            `).join('')}
          </div>
        </div>`
      : '';

    const useCaseHtml = useCase
      ? `
        <div class="section">
          <div class="section-label">Real-World Use Case</div>
          <div class="use-case-text">${escapeHtml(useCase)}</div>
        </div>`
      : '';

    const interviewHtml = interview
      ? `
        <div class="interview-block">
          <div class="section-label" style="color:var(--green); margin-bottom:12px;">💬 Interview Answer</div>
          <div class="interview-text">${escapeHtml(interview)}</div>
        </div>`
      : '';

    return `
      <div class="card-header">
        <div class="card-badge">🏆</div>
        <div class="card-meta">
          <div class="card-title">${escapeHtml(name)}</div>
          <div class="card-subtitle">
            <span class="meta-tag">🏛️ ${escapeHtml(issuer)}</span>
            <span class="meta-tag">📅 ${escapeHtml(String(year))}</span>
            ${src ? `<span class="meta-tag">📄 ${escapeHtml(src)}</span>` : ''}
          </div>
        </div>
      </div>
      ${oneLinerHtml}
      ${learningsHtml}
      ${useCaseHtml}
      ${interviewHtml}
      ${processed ? `<div class="file-info">⏱ Processed: ${escapeHtml(processed)}</div>` : ''}
    `;
  }

  /* ── Scan ───────────────────────────────────────────────────────────── */
  async function triggerScan() {
    const btn = document.getElementById('scan-btn');
    btn.classList.add('scanning');
    btn.innerHTML = '<div class="spinner"></div> Scanning…';

    showToast('Scanning for new certs…');

    try {
      await fetch('/api/scan', { method: 'POST' });
      pollScanStatus();
    } catch(e) {
      btn.classList.remove('scanning');
      btn.innerHTML = '<span class="btn-icon">🔍</span> Scan for New Certs';
      showToast('Scan failed — is the server running?');
    }
  }

  function pollScanStatus() {
    const interval = setInterval(async () => {
      try {
        const r = await fetch('/api/scan_status');
        const s = await r.json();
        if (!s.scanning) {
          clearInterval(interval);
          // Refresh everything
          await loadStats();
          await loadCerts();

          const btn = document.getElementById('scan-btn');
          btn.classList.remove('scanning');
          btn.innerHTML = '<span class="btn-icon">🔍</span> Scan for New Certs';
          showToast('✅ Scan complete!', 3000);
        }
      } catch(e) {
        clearInterval(interval);
      }
    }, 1500);

    // Safety timeout — stop polling after 3 minutes
    setTimeout(() => clearInterval(interval), 180000);
  }

  /* ── Toast ──────────────────────────────────────────────────────────── */
  let toastTimer = null;
  function showToast(msg, duration = 0) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    if (duration > 0) {
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }
  }

  /* ── Helpers ────────────────────────────────────────────────────────── */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  init();
</script>
